<!-- fragments/layout.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main th:fragment="layout(content)">
    <div class="nav-bar">
        <div class="bar-container">
            <nav class="top-nav">
                <div class="left-header">
                    <div class="admin-header">
                        <div class="admin-header-name">Game Pool</div>
                        <div class="wallet-funds">Available Funds: <span th:text="${balance} + ' €'"></span></div>
                    </div>
                    <select onchange="window.location.search='?lang='+this.value" class="form-select locale-switch-front"
                            id="locale">
                        <option th:each="loc : ${locales}"
                                th:value="${loc.language}"
                                th:selected="${loc.language == currentLocale.language}"
                                th:text="${loc.getDisplayLanguage(loc)}">
                        </option>
                    </select>
                </div>

                <ul class="nav-links">
                    <li>
                        <a th:href="@{/dashboard}" th:classappend="${page} == 'home' ? 'active'">
                            <span>Profile</span>
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/dashboard/games}" th:classappend="${page} == 'games' ? 'active'">
                            <span>Game List</span>
                        </a>
                    </li>

                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle">Personal Links ▾</a>
                        <ul class="dropdown-menu">
                            <li>
                                <a th:href="@{/dashboard/friends}" th:classappend="${page} == 'friends' ? 'active'">Friends</a>
                            </li>
                            <li>
                                <a th:href="@{/dashboard/games/wishlist}"
                                   th:classappend="${page} == 'wishlist' ? 'active'">Wish
                                    List</a>
                            </li>
                            <li>
                                <a th:href="@{/dashboard/wallet}"
                                   th:classappend="${page} == 'wallet' ? 'active'">Wallet</a>
                            </li>
                        </ul>
                    </li>

                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle">Utility ▾</a>
                        <ul class="dropdown-menu">
                            <li>
                                <a th:href="@{/dashboard/notifications}"
                                   th:classappend="${page} == 'notifications' ? 'active'">Notifications</a>
                            </li>
                        </ul>
                    </li>

                    <li>
                        <a class="logout" href="/logout">Logout</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="main-section">
        <div class="home-section" th:insert="${content}"></div>

        <div class="footer"><p>© 2025 Game Pool. Don`t annoy the admins.</p></div>
    </div>
</main>
</body>
</html>
