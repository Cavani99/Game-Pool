<!-- fragments/layout.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main th:fragment="layout(content)">
    <div class="nav-bar">
        <div class="bar-container">
            <nav class="top-nav">
                <div class="left-header">
                    <div class="admin-header">
                        <div class="admin-header-name">Game Pool</div>
                        <div class="wallet-funds">
                            <div th:text="#{available_funds} + ': '"></div>
                            <span th:text="${balance} + ' €'"></span>
                        </div>
                    </div>
                    <select onchange="window.location.search='?lang='+this.value"
                            class="form-select locale-switch-front"
                            id="locale">
                        <option th:each="loc : ${locales}"
                                th:value="${loc.language}"
                                th:selected="${loc.language == currentLocale.language}"
                                th:text="${loc.getDisplayLanguage(loc)}">
                        </option>
                    </select>
                </div>

                <ul class="nav-links">
                    <li>
                        <a th:href="@{/dashboard}" th:classappend="${page} == 'home' ? 'active'">
                            <span th:text="#{profile}"></span>
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/dashboard/games}" th:classappend="${page} == 'games' ? 'active'">
                            <span th:text="#{game_list}"></span>
                        </a>
                    </li>

                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" th:text="#{personal_links} + ' ▾'"></a>
                        <ul class="dropdown-menu">
                            <li>
                                <a th:href="@{/dashboard/friends}" th:classappend="${page} == 'friends' ? 'active'"
                                   th:text="#{friends}"></a>
                            </li>
                            <li>
                                <a th:href="@{/chat}" th:classappend="${page} == 'chat' ? 'active'"
                                   th:text="#{chat}"></a>
                            </li>
                            <li>
                                <a th:href="@{/dashboard/games/wishlist}"
                                   th:classappend="${page} == 'wishlist' ? 'active'" th:text="#{wish_list}"></a>
                            </li>
                            <li>
                                <a th:href="@{/dashboard/wallet}"
                                   th:classappend="${page} == 'wallet' ? 'active'" th:text="#{wallet}"></a>
                            </li>
                        </ul>
                    </li>

                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" th:text="#{utility} + ' ▾'"></a>
                        <ul class="dropdown-menu">
                            <li>
                                <a th:href="@{/dashboard/notifications}"
                                   th:classappend="${page} == 'notifications' ? 'active'"
                                   th:text="#{notifications}"></a>
                            </li>
                        </ul>
                    </li>

                    <li>
                        <a class="logout" href="/logout" th:text="#{logout}"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="main-section">
        <div class="home-section" th:insert="${content}"></div>

        <div class="footer"><p th:text="#{footer_user}"></p></div>
    </div>
</main>
</body>
</html>
