<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title th:text="${title} ?: 'Home Page'"></title>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/css/top-bar.css">
    <link rel="stylesheet" type="text/css" href="/css/user-common.css">
    <link rel="stylesheet" type="text/css" href="/css/friends.css">
    <link rel="stylesheet" type="text/css" href="/css/chat.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/js/chat.js"></script>
</head>
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<body th:replace="fragments/layout :: layout(~{::content})">
<div th:fragment="content">
    <div class="single-section-box home-profile-information" style="padding: 0 !important;">
        <div class="friends-container">
            <div class="friends-list">
                <div class="friend-result-list" th:unless="${friends.isEmpty()}">
                    <div class="friend" th:each="user: ${friends}">

                        <div class="friend-img">
                            <img th:src="${user.avatar}" alt="Profile Picture">
                        </div>

                        <div class="friend-name">
                            <p th:text="${user.username}"></p>
                        </div>

                        <div class="friend-actions">
                            <a th:href="@{/chat/open_chat/{id} (id=${user.id})}"
                               class="friend-btn details-btn chat-btn" th:text="#{chat}">
                            </a>
                        </div>
                    </div>
                </div>
                <div class="no-friends" th:if="${friends.isEmpty()}">
                    <h1 th:text="#{no_friends}"></h1>
                </div>
            </div>
            <div class="chat-side">
                <div class="result-container">
                    <div class="chat-wrapper">
                        <div class="chat-box">
                            <div class="chat-box-header">
                                <a class="close-chat-btn" href="#" th:text="#{close-button}">
                                </a>
                            </div>
                            <div class="messages-list"></div>
                            <div class="send-message-wrapper">
                                <div class="send-message-box">
                                    <input class="form-control message-field" type="text" placeholder="Message">
                                    <a th:href="@{/chat/send_message}"
                                       class="friend-btn send-message-btn chat-btn" th:text="#{send}">
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
