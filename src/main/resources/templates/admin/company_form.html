<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Admin Panel'">Admin Panel</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <link rel="stylesheet" type="text/css" th:href="@{/css/side-bar.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin-common.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/form-styles.css}">
</head>
<body th:replace="fragments/admin-layout :: layout(~{::content})">
<div th:fragment="content">
    <div class="single-section-box home-profile-information">
        <form class="auth-form"
              th:action="${company_id} != null ? @{/admin/companies/edit/{id} (id=${company_id})} : @{/admin/companies/add}"
              th:method="POST" th:object="${company}">
            <h2 class="text-center mb-4" th:text="#{add_company}"></h2>
            <span class="badge badge-error" th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}"></span>
            <div class="form-group text-center form-field">
                <label for="name" class="control-label col-sm-2"><span th:text="#{name} + ':'"></span></label>
                <input th:field="*{name}" class="form-control input" id="name" name="name"
                       type="text" th:placeholder="#{enter_company_name}" style="width: 300px;">
            </div>

            <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary btn-lg" th:text="#{submit}"></button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
