<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Admin Panel'">Admin Panel</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <link rel="stylesheet" type="text/css" th:href="@{/css/side-bar.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin-common.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin.css}">

    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- jQuery library -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="/js/games-admin.js"></script>
</head>
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<body th:replace="fragments/admin-layout :: layout(~{::content})">
<div th:fragment="content">
    <div class="single-section-box home-profile-information">
        <div class="btn-header">
            <p class="text-center message-box" th:if="${message != null}" th:text="${message}"></p>
            <div class="event-message" id="games-images-message" th:text="#{games_images_deleted}"></div>
            <button class="btn btn-success delete-images" th:href="@{/admin/games/delete-images}"
                    th:text="#{games_images_delete}">
            </button>
            <a th:href="@{/admin/games/add}">
                <button class="btn btn-primary admin-btn" th:text="#{add_game}">
                </button>
            </a>
        </div>
        <div th:if="${games.isEmpty()}">
            <h3 th:text="#{no_games}"></h3>
        </div>
        <div class="table-container" th:unless="${games.isEmpty()}">
            <table class="table">
                <thead>
                <tr class="thead-dark">
                    <th class="text-center" th:text="#{image}">
                    </th>
                    <th class="text-center" th:text="#{title}">
                    </th>
                    <th class="text-center" th:text="#{category}">
                    </th>
                    <th class="text-center" th:text="#{company}">
                    </th>
                    <th class="text-center" th:text="#{price}">
                    </th>
                    <th class="text-center" th:text="#{discounted}">
                    </th>
                    <th class="text-center" th:text="#{actions}">
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="game, stat : ${games}" th:classappend="${stat.index % 2 != 0} ? 'table-active'">
                    <td class="center-td">
                        <img th:src="@{${game.image}}" alt="No Image"
                             class="img-list">
                    </td>
                    <td class="center-td" th:text="${game.title}">
                    </td>
                    <td class="center-td" th:text="${game.category.name}">
                    </td>
                    <td class="center-td" th:text="${game.company.name}">
                    </td>
                    <td class="center-td" th:text="${game.price} + '€'">
                    </td>
                    <td class="center-td">
                        <span th:if="${game.discount != null && game.discount.isDiscountActive() == true}"
                              class="active-box" th:text="#{yes}">
                        </span>
                        <span th:if="${game.discount == null || game.discount.isDiscountActive() == false}"
                              class="inactive-box" th:text="#{no}">
                        </span>
                    </td>
                    <td class="center-td">
                        <a th:href="@{/admin/games/edit/{id} (id=${game.id})}">
                            <button class="btn btn-warning" th:text="#{edit_game}">
                            </button>
                        </a>
                        <a th:href="@{/admin/games/delete/{id} (id=${game.id})}">
                            <button class="btn btn-danger" th:text="#{delete_game}">
                            </button>
                        </a>
                        <a th:href="@{/admin/games/discount/{id} (id=${game.id})}">
                            <button class="btn btn-success"
                                    th:if="${game.discount != null && game.discount.isDiscountActive() == true}"
                                    th:text="#{edit_discount}">
                            </button>
                            <button class="btn btn-success"
                                    th:unless="${game.discount != null && game.discount.isDiscountActive() == true}"
                                    th:text="#{add_discount}">
                            </button>
                        </a>
                        <a th:href="@{/admin/games/remove_discount/{id} (id=${game.id})}"
                           th:if="${game.discount != null && game.discount.isDiscountActive() == true}">
                            <button class="btn btn-dark" th:text="#{remove_discount}">
                            </button>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
