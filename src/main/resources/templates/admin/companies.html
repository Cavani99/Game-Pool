<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Admin Panel'">Admin Panel</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <link rel="stylesheet" type="text/css" th:href="@{/css/side-bar.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin-common.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin.css}">

    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- jQuery library -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body th:replace="fragments/admin-layout :: layout(~{::content})">
<div class="single-section-box home-profile-information" th:fragment="content">
    <div class="btn-header">
        <p class="text-center message-box" th:if="${message != null}" th:text="${message}"></p>
        <a th:href="@{/admin/companies/add}">
            <button class="btn btn-primary admin-btn" th:text="#{add_company}">
            </button>
        </a>
    </div>
    <div th:if="${companies.isEmpty()}">
        <h3 th:text="#{no_companies}"></h3>
    </div>
    <div class="table-container" th:unless="${companies.isEmpty()}">
        <table class="table">
            <thead>
            <tr class="thead-dark">
                <th class="text-center" th:text="#{name}">
                </th>
                <th class="text-center" th:text="#{actions}">
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="company, stat : ${companies}" th:classappend="${stat.index % 2 != 0} ? 'table-active'">
                <td class="center-td" th:text="${company.name}">
                </td>
                <td class="center-td">
                    <a th:href="@{/admin/companies/edit/{id} (id=${company.id})}">
                        <button class="btn btn-warning" th:text="#{edit_company}">
                        </button>
                    </a>
                    <a th:href="@{/admin/companies/delete/{id} (id=${company.id})}">
                        <button class="btn btn-danger" th:text="#{delete_company}">
                        </button>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
