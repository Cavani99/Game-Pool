<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Blue Water — Login</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/pre-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="ocean" aria-hidden="true">
    <div class="wave w1"></div>
    <div class="wave w2"></div>
    <div class="wave w3"></div>
</div>

<main class="card" role="main" aria-labelledby="login-heading">
    <a class="auth-close" href="/" aria-label="Back to home"
       style="color: var(--muted); position: absolute; right: 16px; top: 16px;">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>
    </a>

    <div class="brand">
        <div class="logo" aria-hidden> 🎮
        </div>
        <div>
            <h1 id="login-heading">Game Pool</h1>
            <p class="lead" th:text="#{login.greeting_login}"></p>
        </div>
    </div>

    <form class="auth-form" th:action="@{/login}" th:method="POST" th:object="${user}">
        <div class="badge-error" th:if="${error}">
            <span th:text="${error}"></span>
        </div>
        <div class="form-group">
            <label for="email" th:text="#{email}"></label>
            <input th:field="*{email}" class="form-control input" id="email" name="email"
                   type="text" th:placeholder="#{enter_email}" required>
        </div>

        <div class="form-group">
            <label for="password" th:text="#{password}"></label>
            <div class="password-wrap">
                <input th:field="*{password}" class="form-control input" id="password" name="password"
                       type="password" th:placeholder="#{enter_password}" required>
                <i class="fa-solid fa-eye toggle-password" id="toggleIcon"
                   aria-label="Show password" onclick="togglePassword()"></i>
            </div>
        </div>

        <button type="submit" class="btn btn-primary full" th:text="#{login}"></button>

        <div class="footer-note">
            <span th:text="#{login.no_account}"></span>
            <a href="/register" style="color:var(--accent);text-decoration:underline;"
               th:text="#{login.register_here}"></a>
        </div>
    </form>
</main>

<script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const icon = document.getElementById("toggleIcon");
      const isHidden = passwordInput.type === "password";

      passwordInput.type = isHidden ? "text" : "password";
      icon.classList.toggle("fa-eye");
      icon.classList.toggle("fa-eye-slash");
      icon.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
    }
</script>
</body>
</html>
